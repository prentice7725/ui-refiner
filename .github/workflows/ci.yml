name: ui-refiner source CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:ui
      - run: npm run smoke:gate
      - run: node scripts/sync-vendor.mjs --lintapple 90ddc736af6f2712903d53dd9a463445e109f586
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-contracts
          path: artifacts/upstream-contracts/
          if-no-files-found: warn
