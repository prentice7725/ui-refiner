# Example for a target app, adapt start command and readiness probe.
name: Web app UI QA
on:
  pull_request:
  workflow_dispatch:
jobs:
  ui-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: |
          npm ci
          (cd tools/ui-refiner && npm ci)
          npx --prefix tools/ui-refiner playwright install --with-deps chromium
      - run: bash tools/ui-refiner/scripts/install-suta.sh "$PWD"
      - run: npm run dev -- --host 127.0.0.1 > app.log 2>&1 &
      - run: node tools/ui-refiner/bin/ui-refiner.mjs check --config ui-refiner.config.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-refiner-evidence
          path: artifacts/ui-refiner/
          if-no-files-found: warn
